services:
  postgres:
    image: postgres:16-alpine
    container_name: nexstay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nexstay}
      POSTGRES_USER: ${DB_USERNAME:-nexstay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexstay}
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - nexstay_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexstay-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"

volumes:
  nexstay_pgdata:
